services:
  universal-ai-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: universal-ai-studio:latest
    container_name: universal-ai-studio
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Use host.docker.internal for services running on the Windows host.
      ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL:-http://host.docker.internal:9200}
      KIBANA_URL: http://kibana:5601
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      # Elasticsearch is running on the Windows host and publishes port 9200.
      ELASTICSEARCH_HOSTS: ${KIBANA_ELASTICSEARCH_HOSTS:-http://host.docker.internal:9200}
      SERVER_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
