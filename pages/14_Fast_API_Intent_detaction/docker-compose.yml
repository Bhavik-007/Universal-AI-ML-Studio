version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: att-fiber-nginx
    ports:
      - "${NGINX_PUBLIC_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: att-fiber-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data: